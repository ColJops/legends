spring.datasource.url=jdbc:h2:mem:legends_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Regular tests use Hibernate's disposable H2 schema. The dedicated migration
# schema test enables Flyway against MySQL to cover the MySQL-specific V6 SQL.
spring.flyway.enabled=false

app.upload.dir=${java.io.tmpdir}/legends-test-uploads
app.cors.allowed-origins=http://localhost:5173

jwt.secret-base64=D09jItv+bW8DZaiDi0Gbjdz43knHYDUV7C5F8jXjb5Q=
jwt.expiration=3600000

app.mail.mode=log
app.mail.from=no-reply@localhost
app.email-verification.url=http://localhost:8080/api/auth/verify-email
app.email-verification.expiration-hours=24
app.password-reset.url=http://localhost:5173/reset-password
app.password-reset.expiration-minutes=60
