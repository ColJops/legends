spring.application.name=backend

# Base profile must not contain real database credentials.
# Provide DB_URL, DB_USERNAME and DB_PASSWORD in your environment,
# or run the app with the local profile: --spring.profiles.active=local
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appbase}
spring.datasource.username=${DB_USERNAME:app_user}
spring.datasource.password=${DB_PASSWORD:change_me}

spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

# Safer defaults. Use application-local.properties during local development.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

app.upload.dir=${APP_UPLOAD_DIR:uploads/legends}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Required in the base/production configuration. Store a Base64-encoded
# random key of at least 32 decoded bytes in the environment.
jwt.secret-base64=${JWT_SECRET_BASE64}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated list, for example:
# https://legends.example.com,https://admin.legends.example.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Email verification. Production must explicitly choose smtp mode and provide
# the public verification endpoint URL and sender address.
app.mail.mode=${APP_MAIL_MODE}
app.mail.from=${MAIL_FROM}
app.email-verification.url=${APP_EMAIL_VERIFICATION_URL}
app.email-verification.expiration-hours=${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
