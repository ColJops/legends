# Local-only development profile.
# Do not use these settings in production.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appbase}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.flyway.baseline-on-migrate=true

# Local fallback only. Setting JWT_SECRET_BASE64 overrides it.
jwt.secret-base64=${JWT_SECRET_BASE64:D09jItv+bW8DZaiDi0Gbjdz43knHYDUV7C5F8jXjb5Q=}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Local development prints the verification link to the backend log.
app.mail.mode=${APP_MAIL_MODE:log}
app.mail.from=${MAIL_FROM:no-reply@localhost}
app.email-verification.url=${APP_EMAIL_VERIFICATION_URL:http://localhost:8080/api/auth/verify-email}
app.email-verification.expiration-hours=${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
